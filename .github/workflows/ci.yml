name: CI

# WHY THIS EXISTS. This repository had no CI and no tests. merelang/mere's CI
# checks that its `main` still COMPILES this code (test/downstream/REPOS), but
# "does it build" and "does it read a .wasm the way wabt reads it" are
# different questions -- and the README already makes the second claim:
# "Output matches wasm-objdump -h/-x".
#
# The gate runs that claim against wabt's objdump, a different implementation
# of the same reading written by other people. Nothing is compared against a
# recording of mwasm's own past output, which could catch a change and never a
# mistake.

on:
  push:
  pull_request:
  # The compiler moves daily and this repository does not, so a weekly run
  # catches the case where nothing here changed and it broke anyway.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # BUILT FROM main, NOT FROM THE LATEST RELEASE -- this repository is
      # developed against the compiler as it is, and Mere's own Wasm backend is
      # one of the two producers the gate reads from, so an old compiler would
      # also mean old modules.
      - name: Check out the Mere compiler
        uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe

      # wabt is the oracle AND the assembler for the hand-written modules.
      # verify.sh skips loudly without it rather than passing.
      - name: wabt (the oracle)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wasm-objdump --version
          wat2wasm --version

      # MEASURED before wiring it: 8 checks -- four modules from Mere's own
      # Wasm backend, three hand-written for sections Mere does not emit, and
      # a file that is not a module at all, which mwasm has to refuse rather
      # than invent sections from.
      - name: verify.sh — mwasm against wasm-objdump
        run: MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" CC=clang sh verify.sh
